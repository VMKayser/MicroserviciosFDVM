syntax = "proto3";
package clinica.medicos.v1;
service ServicioMedicos {
  rpc ObtenerMedico (MedicoReq) returns (Medico);
  rpc ListarMedicos (ListarMedicosReq) returns (ListaMedicos);
  rpc ListarHorariosDisponibles (MedicoReq) returns (stream Horario);
  rpc ReservarHorario (HorarioReq) returns (Horario);
}
message MedicoReq {
  int32 id = 1;
}
message Medico {
  int32 id = 1;
  string nombre = 2;
  string especialidad = 3;
  string matricula = 4;
}
message ListarMedicosReq {}
message ListaMedicos {
  repeated Medico medicos = 1;
}
message Horario {
  int32 id = 1;
  int32 medico_id = 2;
  string fecha = 3;
  string hora = 4;
  string disponible = 5;
}
message HorarioReq {
  int32 id = 1;
}
